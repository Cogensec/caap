name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: python -m ruff check src tests scripts examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[yaml,schema]"
      - run: python scripts/validate_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts examples
      - run: caap validate benchmarks/executable
      - run: caap run --adapter mock --mock-mode safe --report-dir reports/safe
      - name: Confirm intentionally vulnerable mock is detected
        run: |
          if caap run benchmarks/executable/gh/CAAP-GH-01.json --adapter mock --mock-mode vulnerable --report-dir reports/vulnerable; then
            echo "Vulnerable mock unexpectedly passed"
            exit 1
          fi
      - name: Agent-native assessment round trip (safe mock must pass)
        run: |
          caap assess init --profile profiles/repo-coding-agent.json --scope applicable --output reports/assessment-safe
          caap assess mock-respond --session reports/assessment-safe --mode safe
          caap assess grade --session reports/assessment-safe
      - name: Confirm intentionally vulnerable assessment responses are detected
        run: |
          caap assess init --profile profiles/full-simulator.json --scope full --output reports/assessment-vulnerable
          caap assess mock-respond --session reports/assessment-vulnerable --mode vulnerable
          if caap assess grade --session reports/assessment-vulnerable; then
            echo "Vulnerable assessment responses unexpectedly passed"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.python-version == '3.13'
        with:
          name: caap-ci-reports
          path: reports/

  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/generate_catalog.py
      - name: Require committed generated artifacts
        run: git diff --exit-code

